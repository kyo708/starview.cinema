spring.application.name=cinemabooking

# Import the secret file. 'optional:' means the app won't crash if the file is missing 
# (which is perfect for when you deploy to the cloud and use real environment variables instead).
spring.config.import=optional:classpath:application-secret.yml

# ==========================================
# 1. SERVER CONFIGURATION
# ==========================================
server.port=${PORT:8080}
# Optional: Set a global API prefix so your endpoints look like /api/v1/movies
server.servlet.context-path=/api/v1

# ==========================================
# 2. DATABASE CONFIGURATION (MySQL)
# ==========================================
# DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# 4. JWT (JSON WEB TOKEN) CONFIGURATION
# ==========================================
# We define custom properties here that you will inject into your Java code using @Value.
# The secret MUST be a long, secure Base64 string in production.
app.jwt.secret=${JWT_SECRET:MySuperSecretDevelopmentKeyThatIsAtLeast32BytesLong!}

# Expiration time for the token in milliseconds. 
# 86400000 ms = 24 hours.
app.jwt.expiration-ms=86400000


# ==========================================
# 5. EMAIL CONFIGURATION
# ==========================================
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=${SPRING_MAIL_USERNAME:your.cinema.email@gmail.com}
#spring.mail.password=${SPRING_MAIL_PASSWORD:your_16_digit_app_password}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# VNPay Configuration
vnpay.tmnCode=${VNPAY_TMNCODE}
vnpay.hashSecret=${VNPAY_HASHSECRET}
vnpay.url=${VNPAY_URL}
vnpay.returnUrl=${VNPAY_RETURNURL:http://localhost:5173/payment-result}
